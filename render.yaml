# Base de datos: Neon (no Render Postgres) — el plan free de Render borra
# la base de datos administrada a los 30 días; el free tier de Neon
# persiste indefinidamente (el cómputo "escala a cero" tras ~5 min sin
# uso y se reactiva solo en la siguiente conexión, en general en menos
# de un segundo). Ver README > "Base de datos (Neon)" para cómo crear el
# proyecto y obtener la cadena de conexión correcta.
services:
  - type: web
    name: servicios-api
    runtime: python
    buildCommand: python frontend/seo/generate_pages.py && rm -rf frontend/servicios && cp -r public-seo/servicios frontend/servicios && cp public-seo/sitemap.xml frontend/sitemap.xml && pip install -r backend/requirements.txt && alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: VAPID_PRIVATE_KEY_PEM
        sync: false
      - key: VAPID_CLAIM_EMAIL
        value: mailto:soporte@servicuba.example
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: ServiCuba
      - key: SMTP_USE_TLS
        value: "true"
    plan: free
